<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1d2671, #c33764);
            padding: 20px;
        }

        .register-box {
            width: 450px;
            background: white;
            padding: 35px 40px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .register-box h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
            font-size: 30px;
        }

        .register-box .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background: #fafafa;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #c33764;
            background: white;
            box-shadow: 0 0 0 3px rgba(195, 55, 100, 0.1);
        }

        .gender {
            display: flex;
            gap: 25px;
            margin-top: 8px;
        }

        .gender label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 20px 0;
            font-size: 13px;
            color: #555;
        }

        .terms input {
            margin-top: 3px;
        }

        .terms a {
            color: #c33764;
            text-decoration: none;
            font-weight: 600;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #1d2671, #c33764);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(195, 55, 100, 0.3);
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .login a {
            color: #c33764;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .register-box {
                width: 100%;
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>Create Account</h1>
        <p class="subtitle">Register to get started with us</p>

        <form>

            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>

            <div class="input-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

            <div class="input-group">
                <label>Gender</label>

                <div class="gender">
                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>
                </div>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                </label>
            </div>

            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>

        <div class="login">
            Already have an account?
            <a href="#">Login</a>
        </div>

    </div>

</body>
</html>
